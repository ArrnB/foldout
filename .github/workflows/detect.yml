name: Page detection tests

on:
  push:
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make test photos
        run: |
          pip install numpy pillow
          mkdir -p tests/scenes
          python tests/make_scenes.py tests/scenes
      - name: Run detector
        run: node tests/detect_test.mjs tests/scenes
